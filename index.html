<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة سحابية - لوحة المستخدم</title>
    <style>
        body { background-color: #0d1527; color: white; font-family: sans-serif; text-align: center; direction: rtl; padding: 15px; margin: 0; }
        .container { max-width: 480px; margin: auto; background: #152238; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: right; }
        .title-app { text-align: center; color: #3b82f6; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .label-text { font-size: 13px; color: #3b82f6; margin-bottom: 5px; display: block; font-weight: bold; }
        input { width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 12px; border-radius: 6px; border: 1px solid #1e293b; background: #0d1527; color: white; text-align: center; font-size: 15px; }
        button { width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; text-align: center; }
        .btn-blue { background: #1d4ed8; color: white; }
        .btn-green { background: #16a34a; color: white; }
        .btn-red { background: #dc2626; color: white; }
        .btn-purple { background: #7c3aed; color: white; }
        .info-box { background: #0d1527; padding: 12px; border-radius: 8px; margin: 15px 0; border: 1px solid #1e293b; }
        .info-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
        .crypto-box { border: 1px dashed #22c55e; padding: 10px; margin: 15px 0; border-radius: 6px; background: rgba(34, 197, 94, 0.05); text-align: center; }
        .crypto-address { color: #4ade80; font-size: 13px; word-break: break-all; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="title-app">☁️ منصة سحابية</div>
    
    <label class="label-text">👤 اسم المستخدم الحالي</label>
    <input type="text" id="usernameInput" placeholder="اكتب اسم المستخدم هنا">
    <button class="btn-blue" onclick="loginUser()">💾 حفظ وقفل الحساب</button>

    <label class="label-text">🔗 إرسال طلب مكافأة الإحالة (الدعوة):</label>
    <input type="text" id="inviteInput" placeholder="اسم الصديق المدعو">
    <button class="btn-purple" onclick="sendInviteRequest()">🍇 إرسال المكافأة إلى المشرف</button>

    <div class="info-box">
        <div class="info-row"><span>إجمالي رأس المال:</span><span>USDT <span id="val-balance" style="color:#22c55e; font-weight:bold;">0.00</span></span></div>
        <div class="info-row"><span>الأرباح اليومية:</span><span>USDT <span id="val-profit" style="color:#eab308; font-weight:bold;">0.00</span></span></div>
        <div class="info-row"><span>مكافآت الدعوة:</span><span>USDT <span id="val-bonus" style="color:#a855f7; font-weight:bold;">0.00</span></span></div>
    </div>

    <div class="info-box" style="border-color: #ef4444;">
        <div style="text-align: center; font-size: 13px; color: #ef4444; margin-bottom: 8px;">🚨 لوحة عمليات السحب الفوري (شبكة TRC-20):</div>
        <input type="number" id="withdrawAmount" placeholder="المبلغ بـ USDT">
        <input type="text" id="walletInput" placeholder="أدخل عنوان محفظة TRC-20 الخاصة بك">
        
        <button class="btn-red" onclick="sendWithdrawRequest('capital')">💥 سحب إجمالي رأس المال</button>
        <button class="btn-red" onclick="sendWithdrawRequest('daily')">📊 سحب الأرباح اليومية</button>
        <button class="btn-red" onclick="sendWithdrawRequest('bonus')">💸 سحب مكافأة الدعوة</button>
    </div>

    <div class="crypto-box">
        <span style="font-size: 13px; color: #eab308;">📥 إرسال طلب إيداع (USDT TRC-20):</span>
        <strong class="crypto-address">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</strong>
        <input type="number" id="depositAmount" placeholder="أدخل المبلغ بعد التحويل" style="margin-top: 10px;">
        <button class="btn-green" onclick="sendDepositRequest()">⚡ إرسال طلب الإيداع للمشرف</button>
    </div>
</div>

<script>
    const API_URL = window.location.origin;
    let currentUsername = "";

    async function loginUser() {
        const username = document.getElementById('usernameInput').value.trim();
        if(!username) return alert("الرجاء كتابة الاسم أولاً");
        try {
            const res = await fetch(`${API_URL}/backend/user/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const data = await res.json();
            if(data.success) {
                currentUsername = username;
                document.getElementById('val-balance').innerText = data.user.balance.toFixed(2);
                document.getElementById('val-profit').innerText = data.user.todayProfit.toFixed(2);
                document.getElementById('val-bonus').innerText = data.user.bonus.toFixed(2);
                alert("تم التحقق وحفظ الحساب بنجاح!");
            }
        } catch (err) { alert("خطأ في الاتصال بالخادم"); }
    }

    async function sendInviteRequest() {
        if(!currentUsername) return alert("يرجى قفل الاسم أولاً!");
        const friend = document.getElementById('inviteInput').value.trim();
        if(!friend) return alert("يرجى كتابة اسم الصديق");
        try {
            const res = await fetch(`${API_URL}/backend/user/request`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, amount: 10, type: 'invite_bonus', walletAddress: `دعوة: ${friend}` })
            });
            const data = await res.json();
            if(data.success) { alert(data.message); document.getElementById('inviteInput').value = ""; }
        } catch(e) { alert("خطأ في الاتصال"); }
    }

    async function sendWithdrawRequest(wType) {
        if(!currentUsername) return alert("يرجى قفل الاسم أولاً!");
        const amount = document.getElementById('withdrawAmount').value;
        const wallet = document.getElementById('walletInput').value.trim();
        if(!amount || !wallet) return alert("يرجى ملء خانات المبلغ والمحفظة!");
        try {
            const res = await fetch(`${API_URL}/backend/user/request`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, amount, type: 'withdraw', walletAddress: `نوع: ${wType} | محفظة: ${wallet}` })
            });
            const data = await res.json();
            if(data.success) { alert(data.message); document.getElementById('withdrawAmount').value = ""; document.getElementById('walletInput').value = ""; }
        } catch(e) { alert("خطأ في الاتصال"); }
    }

    async function sendDepositRequest() {
        if(!currentUsername) return alert("يرجى قفل الاسم أولاً!");
        const amount = document.getElementById('depositAmount').value;
        if(!amount) return alert("الرجاء إدخال المبلغ");
        try {
            const res = await fetch(`${API_URL}/backend/user/request`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, amount, type: 'deposit', walletAddress: 'شحن TRC20' })
            });
            const data = await res.json();
            if(data.success) { alert(data.message); document.getElementById('depositAmount').value = ""; }
        } catch(e) { alert("خطأ في الاتصال"); }
    }
</script>
</body>
</html>
