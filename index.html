<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة محاكي التداول</title>
    <style>
        body { background-color: #0B1425; color: #FFFFFF; font-family: sans-serif; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .header-title { text-align: center; font-size: 18px; color: #38BDF8; margin-bottom: 20px; font-weight: bold; }
        .card { background-color: #111C32; border: 1px solid #1E293B; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .label-text { font-size: 13px; color: #94A3B8; margin-bottom: 8px; display: block; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 6px; border: 1px solid #1E293B; background-color: #070D19; color: #FFFFFF; text-align: center; margin-bottom: 10px; }
        .btn-block { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 8px; display: block; }
        .btn-blue { background-color: #2563EB; color: white; }
        .btn-purple { background-color: #7C3AED; color: white; }
        .btn-red { background-color: #DC2626; color: white; }
        .btn-green { background-color: #16A34A; color: white; }
        .btn-cyan { background-color: #0088cc; color: white; }
        .balance-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1E293B; }
        .balance-val { color: #A855F7; font-weight: bold; }
        .log-box { background-color: #070D19; border: 1px solid #1E293B; border-radius: 6px; height: 60px; padding: 10px; font-size: 12px; color: #A0AEC0; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">☁️ منظومة محاكي التداول الذكي والتحليل السحابي</div>

    <!-- 1. الاسم -->
    <div class="card">
        <label class="label-text">👤 اسم المستخدم الحالي:</label>
        <input type="text" id="username" placeholder="يرجى إدخال وتثبيت اسم المستخدم أولاً">
        <button id="save-btn" class="btn-block btn-blue" onclick="lockUser()">💾 حفظ وقفل الحساب</button>
    </div>

    <!-- 2. الجائزة والفريق -->
    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <span class="label-text">🏆 الجائزة الكبرى (40 عضو)</span>
            <span style="color: #FBBF24; font-weight: bold;">2500$</span>
        </div>
        <div>
            <span class="label-text">أعضاء الفريق النشطين:</span>
            <span style="color: #22C55E; font-weight: bold;">0/40</span>
        </div>
    </div>

    <!-- 3. الإحالة البنفسجية -->
    <div class="card" style="border-color: #6D28D9;">
        <label class="label-text">🔗 إرسال طلب مكافأة الإحالة (الدعوة):</label>
        <input type="text" id="invite-code" placeholder="أدخل كود الشخص الذي دعاك">
        <button class="btn-block btn-purple" onclick="sendToAdmin('طلب مكافأة إحالة')">✨ إرسال المكافأة إلى المشرف</button>
    </div>

    <!-- 4. الأرصدة الثلاثة -->
    <div class="card">
        <div class="balance-row"><span>إجمالي رأس المال:</span> <span class="balance-val">USDT 0.00</span></div>
        <div class="balance-row"><span>الأرباح اليومية:</span> <span class="balance-val">USDT 0.00</span></div>
        <div class="balance-row"><span>أرباح التذاكر ومكافآت الدعوة:</span> <span class="balance-val">USDT 0.00</span></div>
    </div>

    <!-- 5. السحب المباشر (الأزرار الحمراء) -->
    <div class="card" style="border-color: #DC2626;">
        <label class="label-text" style="color: #EF4444; text-align: center; font-weight: bold;">🚨 بوابة السحب الفوري المباشر (شبكة TRC-20)</label>
        <input type="number" id="withdraw-amount" placeholder="المبلغ بـ USDT">
        <input type="text" id="withdraw-wallet" placeholder="عنوان محفظة TRC-20">
        
        <button class="btn-block btn-red" onclick="sendToAdmin('سحب إجمالي رأس المال')">💥 سحب إجمالي رأس المال</button>
        <button class="btn-block btn-red" onclick="sendToAdmin('سحب الأرباح اليومية')">📊 سحب الأرباح اليومية</button>
        <button class="btn-block btn-red" onclick="sendToAdmin('سحب مكافأة الدعوة')">💸 سحب مكافأة الدعوة</button>
    </div>

    <!-- 6. الشحن الأخضر -->
    <div class="card" style="border-color: #16A34A;">
        <label class="label-text" style="color: #22C55E; text-align: center; font-weight: bold;">💳 محفظة الإيداع الرسمية - شبكة (USDT TRC-20)</label>
        <span style="color: #FBBF24; display:block; text-align:center; font-size:12px; margin-bottom:5px;">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</span>
        <input type="number" id="deposit-amount" value="100">
        <button class="btn-block btn-green" onclick="sendToAdmin('طلب شحن رصيد')">⚡ إرسال طلب الإيداع للمشرف</button>
    </div>

    <!-- 7. سجل الإشعارات -->
    <div class="card">
        <label class="label-text">📋 سجل المعاملات والإشعارات الحية</label>
        <div class="log-box" id="status-logs">يرجى قفل الاسم أولاً...</div>
    </div>

    <!-- 8. زر التليجرام -->
    <button class="btn-block btn-cyan" onclick="window.open('https://t.me', '_blank')">💬 تواصل مع الدعم الفني (invest_support_bot)</button>
</div>

<script>
    function lockUser() {
        const nameInput = document.getElementById('username');
        if(!nameInput.value.trim()) {
            alert("الرجاء إدخال الاسم");
            return;
        }
        nameInput.disabled = true;
        document.getElementById('save-btn').disabled = true;
        document.getElementById('status-logs').innerText = "تم تأكيد وتثبيت الاسم بنجاح.";
    }

    function sendToAdmin(actionType) {
        const name = document.getElementById('username').value;
        const logBox = document.getElementById('status-logs');
        logBox.innerText = "جاري بث الطلب حياً للمشرف...";
        
        fetch('/api/submit-request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: name || "مستخدم زائر",
                type: actionType,
                amount: document.getElementById('withdraw-amount').value || document.getElementById('deposit-amount').value,
                wallet: document.getElementById('withdraw-wallet').value || "شبكة الإيداع"
            })
        }).then(() => {
            logBox.innerText = "✔️ تم إرسال الطلب بنجاح للمشرف";
        }).catch(() => {
            logBox.innerText = "❌ خطأ في الاتصال";
        });
    }
</script>
</body>
</html>
