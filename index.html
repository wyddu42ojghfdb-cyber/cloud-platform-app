<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة محاكي التداول الذكي والتحليل السحابي</title>
    <style>
        body {
            background-color: #0B1425;
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            transition: all 0.3s ease;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        /* شريط التبديل العلوي للغات */
        .lang-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-lang {
            background-color: #1E293B;
            color: #38BDF8;
            border: 1px solid #38BDF8;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-lang:hover {
            background-color: #38BDF8;
            color: #0B1425;
        }
        .header-title {
            text-align: center;
            font-size: 18px;
            color: #38BDF8;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .card {
            background-color: #111C32;
            border: 1px solid #1E293B;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .label-text {
            font-size: 13px;
            color: #94A3B8;
            margin-bottom: 8px;
            display: block;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #1E293B;
            background-color: #070D19;
            color: #FFFFFF;
            text-align: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        input:disabled {
            background-color: #1E293B !important;
            color: #64748B !important;
            cursor: not-allowed;
        }
        .btn-blue { background-color: #2563EB; color: white; }
        .btn-blue:disabled { background-color: #1E3A8A; cursor: not-allowed; }
        .btn-purple { background-color: #7C3AED; color: white; }
        .btn-red { background-color: #DC2626; color: white; }
        .btn-green { background-color: #16A34A; color: white; }
        .btn-cyan { background-color: #0088cc; color: white; }
        
        .btn-block {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            display: block;
        }
        .btn-block:hover { opacity: 0.9; }

        .balance-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1E293B;
            font-size: 14px;
        }
        .balance-val { color: #A855F7; font-weight: bold; }

        .log-box {
            background-color: #070D19;
            border: 1px solid #1E293B;
            border-radius: 6px;
            height: 90px;
            overflow-y: auto;
            padding: 10px;
            font-size: 12px;
            color: #A0AEC0;
            text-align: center;
        }
        .wallet-address {
            color: #FBBF24;
            font-size: 12px;
            word-break: break-all;
            text-align: center;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شريط اللغات العلوي -->
    <div class="lang-bar">
        <button class="btn-lang" onclick="switchLanguage('ar')">العربية 🇸🇦</button>
        <button class="btn-lang" onclick="switchLanguage('en')">English 🇬🇧</button>
    </div>

    <div class="header-title" id="txt-title">☁️ منظومة محاكي التداول الذكي والتحليل السحابي</div>

    <!-- 1. قسم اسم المستخدم -->
    <div class="card">
        <label class="label-text" id="lbl-username">👤 اسم المستخدم الحالي:</label>
        <input type="text" id="username" placeholder="يرجى إدخال وتثبيت اسم المستخدم أولاً">
        <button id="save-btn" class="btn-block btn-blue" onclick="lockUsernameOnly()">💾 حفظ وقفل الحساب</button>
    </div>

    <!-- 2. عداد الفريق والجائزة -->
    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <span class="label-text" id="lbl-prize">🏆 الجائزة الكبرى (40 عضو)</span>
            <span style="color: #FBBF24; font-weight: bold;" id="val-prize">2500 دولار أمريكي</span>
        </div>
        <div style="text-align: inherit;">
            <span class="label-text" id="lbl-team">أعضاء الفريق النشطين:</span>
            <span style="color: #22C55E; font-weight: bold;">0/40</span>
        </div>
    </div>

    <!-- 3. حقل الإحالات البنفسجي -->
    <div class="card" style="border-color: #6D28D9;">
        <label class="label-text" id="lbl-invite">🔗 إرسال طلب مكافأة الإحالة (الدعوة):</label>
        <input type="text" id="invite-code" placeholder="أدخل كود أو اسم الشخص الذي دعاك">
        <button class="btn-block btn-purple" id="btn-invite" onclick="sendActionToAdmin('Referans İsteği')">✨ إرسال المكافأة إلى المشرف</button>
    </div>

    <!-- 4. حقول الأرصدة الثلاثة المصفرة -->
    <div class="card">
        <div class="balance-row">
            <span id="lbl-b1">إجمالي رأس المال:</span> <span class="balance-val">USDT 0.00</span>
        </div>
        <div class="balance-row">
            <span id="lbl-b2">الأرباح اليومية:</span> <span class="balance-val">USDT 0.00</span>
        </div>
        <div class="balance-row">
            <span id="lbl-b3">أرباح التذاكر ومكافآت الدعوة:</span> <span class="balance-val">USDT 0.00</span>
        </div>
    </div>

    <!-- 5. بوابة السحب الفوري المباشر بثلاثة أزرار حمراء منفصلة -->
    <div class="card" style="border-color: #DC2626;">
        <label class="label-text" style="color: #EF4444; text-align: center; font-weight: bold;" id="lbl-w-title">🚨 بوابة السحب الفوري المباشر (شبكة TRC-20)</label>
        <input type="number" id="withdraw-amount" placeholder="المبلغ بـ USDT">
        <input type="text" id="withdraw-wallet" placeholder="أدخل عنوان محفظة TRC-20 الخاصة بك المستلمة">
        
        <button class="btn-block btn-red" id="btn-w1" onclick="triggerWithdraw('Toplam Sermaye')">💥 سحب إجمالي رأس المال</button>
        <button class="btn-block btn-red" id="btn-w2" onclick="triggerWithdraw('Günlük Karlar')">📊 سحب الأرباح اليومية</button>
        <button class="btn-block btn-red" id="btn-w3" onclick="triggerWithdraw('Davetiye ve Bilet Ödülleri')">💸 سحب مكافأة الدعوة</button>
    </div>

    <!-- 6. حقل الشحن المالي الأخضر -->
    <div class="card" style="border-color: #16A34A;">
        <label class="label-text" style="color: #22C55E; text-align: center; font-weight: bold;" id="lbl-d-title">💳 محفظة الإيداع الرسمية - شبكة (USDT TRC-20)</label>
        <span class="wallet-address" id="admin-wallet">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</span>
        <input type="number" id="deposit-amount" value="100" placeholder="المبلغ المراد شحنه">
        <button class="btn-block btn-green" id="btn-deposit" onclick="sendActionToAdmin('Kontör yükleme bakiyesi')">⚡ إرسال طلب الإيداع للمشرف</button>
    </div>

    <!-- 7. سجل الإشعارات الحية -->
    <div class="card">
        <label class="label-text" id="lbl-logs">📋 سجل المعاملات والإشعارات الحية</label>
        <div class="log-box" id="status-logs">يرجى قفل الاسم لعرض الإشعارات الحية...</div>
    </div>

    <!-- 8. زر التليجرام الفعليinvest_support_bot الموجه مباشرة -->
    <button class="btn-block btn-cyan" id="btn-telegram" onclick="redirectToTelegram()">💬 تواصل مع الدعم الفني عبر تليجرام (invest_support_bot)</button>
</div>
