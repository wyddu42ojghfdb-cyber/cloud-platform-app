<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة محاكي التداول الذكي والتحليل السحابي</title>
    <style>
        :root {
            --bg-color: #0b1426; --card-bg: #111c33; --input-bg: #090f1d;
            --blue-btn: #1a56db; --purple-btn: #7e3af2; --orange-btn: #ea580c;
            --red-btn: #dc2626; --green-btn: #16a34a; --cyan-btn: #06b6d4;
            --text-color: #ffffff; --text-muted: #9ca3af; --border-color: #1e293b;
            --support-btn: #0284c7;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background-color: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid var(--border-color); }
        .lang-bar { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 4px; }
        .lang-btn { flex: 1; padding: 10px 2px; font-size: 13px; background-color: #1e293b; border: 1px solid var(--border-color); color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .lang-btn.active { background-color: var(--blue-btn); }
        .header { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 20px; color: #38bdf8; }
        .section { background-color: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        input { width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 6px; box-sizing: border-box; text-align: center; font-size: 14px; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
        .btn-blue { background-color: var(--blue-btn); } .btn-orange { background-color: var(--orange-btn); }
        .btn-purple { background-color: var(--purple-btn); } .btn-red { background-color: var(--red-btn); }
        .btn-green { background-color: var(--green-btn); } .btn-cyan { background-color: var(--cyan-btn); }
        .btn-support { background-color: var(--support-btn); }
        .stats-row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .value { color: #a855f7; font-weight: bold; }
        .info-text { font-size: 12px; color: #fbbf24; text-align: center; margin-bottom: 8px; }
        .wallet-box { font-family: monospace; background-color: var(--input-bg); padding: 10px; border-radius: 6px; text-align: center; font-size: 12px; color: #4ade80; word-break: break-all; border: 1px dashed #4ade80; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-bar">
        <button class="lang-btn active" id="btn-lang-ar" onclick="changeLang('ar')">العربية</button>
        <button class="lang-btn" id="btn-lang-en" onclick="changeLang('en')">English</button>
    </div>

    <div class="header" id="txt-header">☁️ منظومة محاكي التداول الذكي والتحليل السحابي</div>

    <div class="section">
        <label id="user-label">👤 اسم المستخدم الحالي: (غير مسجل)</label>
        <input type="text" id="username-input" placeholder="اكتب اسمك هنا لبدء البث حياً">
        <button class="btn-blue" id="btn-save-name" onclick="handleLogin()">💾 حفظ وقفل الحساب</button>
    </div>

    <div class="section">
        <div class="info-text" id="txt-grand-prize">👑 جائزة الكبرى (40 عضو) <br> 2500 دولار أمريكي</div>
        <div class="stats-row">
            <span id="txt-team-label">أعضاء الفريق النشطين:</span>
            <span id="team-count" class="value" style="color:#eab308;">0/40</span>
        </div>
    </div>

    <div class="section">
        <div class="stats-row">
            <span id="txt-capital">إجمالي رأس المال:</span>
            <span id="balance-val" class="value">USDT 0.00</span>
        </div>
        <div class="stats-row">
            <span id="txt-profit">الأرباح اليومية:</span>
            <span id="profit-val" class="value" style="color:#16a34a;">USDT 0.00</span>
        </div>
        <div class="stats-row">
            <span id="txt-bonus">أرباح التذاكر ومكافآت الدعوة:</span>
            <span id="bonus-val" class="value" style="color:#22d3ee;">USDT 0.00</span>
        </div>
    </div>

    <div class="section">
        <label id="txt-invite-label">🔗 إرسال طلب مكافأة الإحالة (الدعوة المباشرة):</label>
        <input type="text" id="invite-name" placeholder="اسم الصديق المدعو">
        <button class="btn-purple" id="btn-invite" onclick="sendInviteBonus()">🍇 إرسال المكافأة إلى المشرف</button>
    </div>

    <div class="section">
        <label id="txt-financial-title">💰 العمليات والطلبات المالية الحية:</label>
        
        <label style="color: #fbbf24; font-weight: bold;">📥 محفظة إيداع المنصة الرسمية (TRC-20):</label>
        <div class="wallet-box">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</div>
        
        <input type="number" id="amount-input" placeholder="أدخل الكمية USDT">
        <input type="text" id="wallet-input" placeholder="عنوان محفظة TRC-20 الخاصة بك لاستقبال السحب">
        
        <button class="btn-green" id="btn-deposit" onclick="sendFinancialRequest('deposit')">📥 إيداع رأس المال</button>
        <button class="btn-orange" id="btn-withdraw-daily" onclick="sendFinancialRequest('withdraw_daily')">📤 سحب الأرباح اليومية</button>
        <button class="btn-cyan" id="btn-withdraw-bonus" onclick="sendFinancialRequest('invite_bonus')">💎 سحب أرباح الدعوة والتذاكر</button>
        <button class="btn-red" id="btn-withdraw-capital" onclick="sendFinancialRequest('withdraw_capital')">🚨 سحب رأس المال الإجمالي</button>
    </div>

    <div class="section">
        <label id="txt-support-title">🛠️ مركز المساعدة والتوجيه الرقمي:</label>
        <button class="btn-support" id="btn-open-support" onclick="openTelegramSupport()">💬 التواصل مع الدعم الفني (Telegram)</button>
    </div>
</div>

<script>
    // ربط تلقائي محلي يمنع أي تجمد أو حظر في الشبكة
    const API_BASE_URL = window.location.origin;
    let currentUsername = "";

    function openTelegramSupport() {
        window.open("https://t.me", "_blank");
    }

    async function handleLogin() {
        const usernameInput = document.getElementById('username-input').value.trim();
        if(!usernameInput) return alert("الرجاء كتابة اسم مستخدم صالح");
        
        try {
            const res = await fetch(`${API_BASE_URL}/api/user/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput })
            });
            const data = await res.json();
            if(data.success) {
                currentUsername = data.user.username;
                document.getElementById('user-label').innerText = `👤 اسم المستخدم الحالي: ${currentUsername}`;
                updateDashboardData(data.user);
                alert("تم حفظ وقفل الحساب وبدء البث بنجاح");
                setInterval(fetchUserData, 4000);
            }
        } catch(err) {
            alert("خطأ في الاتصال بالخادم السحابي");
        }
    }

    async function fetchUserData() {
        if(!currentUsername) return;
        try {
            const res = await fetch(`${API_BASE_URL}/api/user/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername })
            });
            const data = await res.json();
            if(data.success) updateDashboardData(data.user);
        } catch(e) { console.error("فشل المزامنة الدوري"); }
    }

    function updateDashboardData(user) {
        document.getElementById('balance-val').innerText = `USDT ${user.balance.toFixed(2)}`;
        document.getElementById('profit-val').innerText = `USDT ${user.todayProfit.toFixed(2)}`;
        document.getElementById('bonus-val').innerText = `USDT ${user.bonus.toFixed(2)}`;
        document.getElementById('team-count').innerText = `${user.teamCount}/40`;
    }

    async function sendFinancialRequest(type) {
        if(!currentUsername) return alert("الرجاء تسجيل الاسم أولاً وقفل الحساب");
        const amount = document.getElementById('amount-input').value;
        const wallet = document.getElementById('wallet-input').value.trim();

        if(!amount || amount <= 0) return alert("الرجاء إدخال كمية صالحة");

        try {
            const res = await fetch(`${API_BASE_URL}/api/user/request`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, amount, type, walletAddress: wallet })
            });
            const data = await res.json();
            if(data.success) {
                alert("تم إرسال الطلب المالي بنجاح وبانتظار تدقيق المشرف");
                document.getElementById('amount-input').value = "";
            }
        } catch(err) {
            alert("فشل إرسال المعاملة المالية");
        }
    }

    async function sendInviteBonus() {
        if(!currentUsername) return alert("الرجاء تسجيل الاسم أولاً");
        const friendName = document.getElementById('invite-name').value.trim();
        if(!friendName) return alert("الرجاء إدخال اسم الصديق");

        try {
            const res = await fetch(`${API_BASE_URL}/api/user/request`, {
                method: 'POST',
