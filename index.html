<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة سحابية - لوحة المستخدم</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; text-align: center; direction: rtl; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, select { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 16px; }
        button { width: 95%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-green { background: #22c55e; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-purple { background: #a855f7; color: white; }
        .btn-orange { background: #eab308; color: black; }
        .box { border: 1px dashed #22c55e; padding: 10px; margin: 15px 0; border-radius: 8px; background: rgba(34, 197, 94, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <!-- قائمة اختيار اللغات الذكية في الأعلى -->
    <select id="langSelect" onchange="switchLanguage(this.value)">
        <option value="ar">🇸🇦 العربية</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="en">🇺🇸 English</option>
    </select>

    <h3 id="txt-title">☁️ منصة سحابية</h3>
    
    <input type="text" id="usernameInput" placeholder="اكتب اسم المستخدم هنا">
    <button class="btn-blue" id="btn-login" onclick="loginUser()">💾 حفظ وقفل الحساب</button>

    <div style="margin: 15px 0; background: #111827; padding: 10px; border-radius: 8px;">
        <p><span id="txt-balance-label">دولار أمريكي رصيد الحساب:</span> <span id="val-balance">0.00</span></p>
        <p><span id="txt-team-label">عداد الفريق:</span> <span id="val-team">0/40</span></p>
    </div>

    <div class="box">
        <p id="txt-dep-title">📌 عنوان الإيداع الرسمي (USDT TRC20):</p>
        <strong style="color: #4ade80; font-size: 14px;">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</strong>
    </div>

    <h4 id="txt-action-title">📥 الإيداع والسحب (الإيداع والسحب)</h4>
    <input type="number" id="amountInput" placeholder="الكمية / المبلغ (المبلغ)">
    <input type="text" id="walletInput" placeholder="أدخل عنوان محفظة TRC-20 الخاصة بك">

    <button class="btn-green" id="btn-deposit" onclick="sendRequest('deposit')">➕ طلب إيداع (طلب إيداع)</button>
    <button class="btn-red" id="btn-withdraw" onclick="sendRequest('withdraw')"> Extracted طلب السحب (طلب السحب)</button>
    <button class="btn-purple" id="btn-bonus" onclick="sendRequest('invite_bonus')">👥 طلب مكافأة الدعوة (طلب مكافأة تهنئة)</button>
    
    <hr style="border: 1px solid #334155; margin: 20px 0;">
    
    <!-- زر الدعم الفني المربوط بحساب تليجرام الخاص بك -->
    <button class="btn-orange" id="btn-support" onclick="window.open('https://t.me', '_blank')">🎧 Canlı Destek (الدعم الفني)</button>
</div>

<script>
    // رابط السيرفر العالمي الموحد على منصة Render
    const API_URL = "https://onrender.com";
    let currentUsername = "";

    async function loginUser() {
        const username = document.getElementById('usernameInput').value.trim();
        if(!username) return alert("الرجاء كتابة الاسم أولاً");
        
        const res = await fetch(`${API_URL}/api/user/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username })
        });
        const data = await res.json();
        if(data.success) {
            currentUsername = username;
            document.getElementById('val-balance').innerText = data.user.balance.toFixed(2);
            document.getElementById('val-team').innerText = data.user.teamCount;
            alert("تم التحقق وحفظ الحساب بنجاح!");
        }
    }

    async function sendRequest(type) {
        if(!currentUsername) return alert("يرجى قفل الاسم أولاً لتتمكن من إرسال الطلبات!");
        const amount = document.getElementById('amountInput').value;
        const walletAddress = document.getElementById('walletInput').value;

        const res = await fetch(`${API_URL}/api/user/request`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUsername, amount, type, walletAddress })
        });
        const data = await res.json();
        if(data.success) {
            alert(data.message);
        }
    }

    // دالة تبديل اللغات الفورية داخل الواجهة
    function switchLanguage(lang) {
        if(lang === 'tr') {
            document.getElementById('txt-title').innerText = "☁️ Bulut Platformu";
            document.getElementById('usernameInput').placeholder = "Kullanıcı Adınızı Girin";
            document.getElementById('btn-login').innerText = "Kaydet ve Kilitle";
            document.getElementById('txt-balance-label').innerText = "Hesap Bakiyesi:";
            document.getElementById('txt-team-label').innerText = "Takım Sayısı:";
            document.getElementById('txt-dep-title').innerText = "📌 Resmi Para Yatırma Adresi (USDT TRC20):";
            document.getElementById('txt-action-title').innerText = "📥 Para Yatırma ve Çekme";
            document.getElementById('amountInput').placeholder = "Miktar / Amount";
            document.getElementById('walletInput').placeholder = "Kendi Cüzdan Adresiniz";
            document.getElementById('btn-deposit').innerText = "➕ Para Yatırma Talebi";
            document.getElementById('btn-withdraw').innerText = "➖ Para Çekme Talebi";
            document.getElementById('btn-bonus').innerText = "👥 Davet Bonusu Talebi";
            document.getElementById('btn-support').innerText = "🎧 Canlı Destek";
            document.body.style.direction = "ltr";
        } else if(lang === 'en') {
            document.getElementById('txt-title').innerText = "☁️ Cloud Platform";
            document.getElementById('usernameInput').placeholder = "Enter Username";
            document.getElementById('btn-login').innerText = "Save and Lock Account";
            document.getElementById('txt-balance-label').innerText = "Account Balance:";
            document.getElementById('txt-team-label').innerText = "Team Count:";
            document.getElementById('txt-dep-title').innerText = "📌 Official Deposit Address (USDT TRC20):";
            document.getElementById('txt-action-title').innerText = "📥 Deposit & Withdraw";
            document.getElementById('amountInput').placeholder = "Amount";
            document.getElementById('walletInput').placeholder = "Your TRC20 Wallet Address";
            document.getElementById('btn-deposit').innerText = "➕ Deposit Request";
            document.getElementById('btn-withdraw').innerText = "➖ Withdraw Request";
            document.getElementById('btn-bonus').innerText = "👥 Invite Bonus Request";
            document.getElementById('btn-support').innerText = "🎧 Customer Support";
            document.body.style.direction = "ltr";
        } else {
            // العودة للعربية القياسية
            document.getElementById('txt-title').innerText = "☁️ منصة سحابية";
            document.getElementById('usernameInput').placeholder = "اكتب اسم المستخدم هنا";
            document.getElementById('btn-login').innerText = "💾 حفظ وقفل الحساب";
            document.getElementById('txt-balance-label').innerText = "دولار أمريكي رصيد الحساب:";
            document.getElementById('txt-team-label').innerText = "عداد الفريق:";
            document.getElementById('txt-dep-title').innerText = "📌 عنوان الإيداع الرسمي (USDT TRC20):";
            document.getElementById('txt-action-title').innerText = "📥 الإيداع والسحب (الإيداع والسحب)";
            document.getElementById('amountInput').placeholder = "الكمية / المبلغ (المبلغ)";
            document.getElementById('walletInput').placeholder = "أدخل عنوان محفظة TRC-20 الخاصة بك";
            document.getElementById('btn-deposit').innerText = "➕ طلب إيداع (طلب إيداع)";
            document.getElementById('btn-withdraw').innerText = "➖ طلب السحب (طلب السحب)";
            document.getElementById('btn-bonus').innerText = "👥 طلب مكافأة الدعوة (طلب مكافأة تهنئة)";
            document.getElementById('btn-support').innerText = "🎧 Canlı Destek (الدعم الفني)";
            document.body.style.direction = "rtl";
        }
    }
</script>
</body>
</html>
