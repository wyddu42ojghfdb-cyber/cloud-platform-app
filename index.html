<script>
    const API_URL = window.location.origin;
    let currentUsername = "";
    let pollTimer = null;
    let isRefreshing = false;

    const $ = (id) => document.getElementById(id);

    // دالة الاتصال المباشر والمبسطة لتفادي حظر أمان المتصفحات (CORS)
    async function apiPost(path, payload) {
        try {
            const res = await fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return await res.json();
        } catch (e) {
            throw e;
        }
    }

    // خطتك الذكية: قفل حقل الاسم وزر الحفظ فقط وتأمين الشاشة
    function lockNameField() {
        $('usernameInput').disabled = true;
        $('btn-login-action').disabled = true;
        $('txt-user-sub').innerText = "🟢 تم حفظ وقفل الاسم بنجاح";
        $('txt-user-sub').style.color = "#22c55e";
    }

    function unlockNameField() {
        $('usernameInput').disabled = false;
        $('btn-login-action').disabled = false;
    }

    async function loginUser() {
        const username = $('usernameInput').value.trim();
        if (!username) return alert("الرجاء كتابة الاسم أولاً");

        currentUsername = username;
        lockNameField();

        try {
            const data = await apiPost("/backend/user/login", { username: currentUsername });
            if (data && data.user) updateUI(data.user);
            try { localStorage.setItem('savedUsername', currentUsername); } catch (e) {}
            startPolling();
        } catch (e) {
            console.error(e);
            currentUsername = "";
            unlockNameField();
            alert("تعذّر حفظ الاسم، تحقق من اتصال السيرفر وأعد المحاولة");
        }
    }

    function startPolling() {
        if (pollTimer) return;
        refreshData();
        pollTimer = setInterval(refreshData, 3000);
    }

    function updateUI(user) {
        $('val-balance').innerText = Number(user.balance || 0).toFixed(2);
        $('val-profit').innerText  = Number(user.todayProfit || 0).toFixed(2);
        $('val-bonus').innerText   = Number(user.bonus || 0).toFixed(2);
        $('val-team').innerText    = (user.teamCount || 0) + "/40";
    }

    async function refreshData() {
        if (!currentUsername || isRefreshing) return;
        isRefreshing = true;
        try {
            const data = await apiPost("/backend/user/login", { username: currentUsername });
            if (data && data.success && data.user) updateUI(data.user);

            const hRes = await fetch("/backend/user/history?username=" + encodeURIComponent(currentUsername));
            if (hRes.ok) {
                const hData = await hRes.json();
                const box = $('logs-container');
                if (hData.history && hData.history.length > 0) {
                    box.innerHTML = "";
                    hData.history.forEach(h => {
                        const div = document.createElement('div');
                        div.style.cssText = "border-bottom:1px solid #1e293b; padding:4px 0; color:#22c55e;";
                        div.textContent = h.message;
                        box.appendChild(div);
                    });
                }
            }
        } catch (e) {
            console.warn('refresh failed', e);
        } finally {
            isRefreshing = false;
        }
    }

    async function sendDepositRequest() {
        if (!currentUsername) return alert("يرجى كتابة الاسم والضغط على زر حفظ وقفل الحساب أولاً!");
        const amount = parseFloat($('depositAmount').value);
        if (!amount || amount <= 0) return alert("الرجاء إدخال مبلغ شحن صحيح");

        try {
            const data = await apiPost("/backend/user/request", {
                username: currentUsername,
                amount: amount,
                type: 'deposit',
                walletAddress: 'شحن TRC20'
            });
            alert("⚡ تم إرسال طلب الإيداع بنجاح وهو قيد المراجعة من الإدارة!");
            $('depositAmount').value = "";
        } catch (e) {
            console.error(e);
            alert("خطأ في الاتصال، لم يُرسل الطلب");
        }
    }

    async function sendWithdrawRequest(wType) {
        if (!currentUsername) return alert("يرجى كتابة الاسم والضغط على زر حفظ وقفل الحساب أولاً!");
        const amount = parseFloat($('withdrawAmount').value);
        const wallet = $('walletInput').value.trim();
        if (!amount || amount <= 0 || !wallet) return alert("الرجاء ملء خانات المبلغ والمحفظة!");

        try {
            await apiPost("/backend/user/request", {
                username: currentUsername,
                amount: amount,
                type: wType,
                walletAddress: wallet
            });
            alert("💸 تم إرسال طلب السحب بنجاح وهو قيد المراجعة!");
            $('withdrawAmount').value = "";
        } catch (e) {
            console.error(e);
            alert("خطأ في الاتصال، لم يُرسل الطلب");
        }
    }

    async function sendInviteRequest() {
        if (!currentUsername) return alert("يرجى كتابة الاسم والضغط على زر حفظ وقفل الحساب أولاً!");
        const friend = $('inviteInput').value.trim();
        if (!friend) return alert("الرجاء كتابة اسم الصديق المدعو");

        try {
            // تصحيح صياغة الحقل ليتوافق مع استقبال السيرفر الخلفي لمشروعك بالملي
            await apiPost("/backend/user/request", {
                username: currentUsername,
                amount: 15,
                type: 'invite_bonus',
                walletAddress: 'دعوة لـ: ' + friend
            });
            alert("🍇 تم إرسال طلب مكافأة الدعوة بقيمة 15 USDT إلى المشرف!");
            $('inviteInput').value = "";
        } catch (e) {
            console.error(e);
            alert("خطأ في الاتصال، لم يُرسل الطلب");
        }
    }

    // استعادة الاسم تلقائياً وثبات الأرصدة عند سحب شاشة الهاتف وتحديثها طوال العمر
    window.addEventListener('DOMContentLoaded', () => {
        try {
            const saved = localStorage.getItem('savedUsername');
            if (saved) {
                $('usernameInput').value = saved;
                currentUsername = saved;
                lockNameField();
                startPolling();
            }
        } catch (e) {}
    });
</script>
