<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulut Platformu - Kullanıcı Paneli</title>
    <style>
        body { background-color: #0b132b; color: #ffffff; font-family: sans-serif; margin: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #1c2541; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #5bc0be; }
        .input-group { margin: 15px 0; }
        input { width: 90%; padding: 10px; border-radius: 5px; border: 1px solid #3a506b; background: #0b132b; color: white; text-align: center; }
        .btn { background-color: #007bff; color: white; border: none; padding: 12px; width: 94%; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn-green { background-color: #2ecc71; }
        .btn-red { background-color: #e74c3c; }
        .btn-support { background-color: #f39c12; margin-top: 20px; display: inline-block; width: 94%; text-decoration: none; line-height: 40px; border-radius: 5px; color: white; font-weight: bold; }
        .balance-box { background: #3a506b; padding: 15px; border-radius: 5px; margin: 20px 0; font-size: 18px; }
        .deposit-address-box { background: #0b132b; border: 1px dashed #2ecc71; padding: 10px; margin: 15px 0; border-radius: 5px; font-size: 13px; word-break: break-all; color: #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <h2>☁️ Bulut Platformu</h2>
    
    <!-- حقل حفظ الاسم وتثبيته -->
    <div class="input-group">
        <input type="text" id="username-field" placeholder="Kullanıcı Adınızı Girin (اسم المستخدم)">
        <button class="btn" onclick="loginUser()">Kaydet ve Kilitle</button>
    </div>

    <!-- عرض رصيد المستخدم وعداد الفريق حياً من السيرفر -->
    <div class="balance-box">
        <div>Hesap Bakiyesi: <strong id="user-balance" class="text-green">0.00 USDT</strong></div>
        <div style="font-size: 14px; margin-top: 5px;">Takım Sayacı: <strong id="user-team">0/40</strong></div>
    </div>

    <!-- خانة الإيداع الرسمية المثبتة للمحفظة الخاصة بك -->
    <div class="deposit-address-box">
        📥 <strong>Resmi Para Yatırma Adresi (USDT TRC20):</strong><br>
        <span id="admin-deposit-wallet">TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN</span>
    </div>

    <!-- حقول المعاملات المالية المربوطة بالمشرف -->
    <h3>📥 Para Yatırma ve Çekme (الإيداع والسحب)</h3>
    <div class="input-group">
        <input type="number" id="amount-field" placeholder="Miktar / Amount (المبلغ)">
    </div>
    <div class="input-group">
        <input type="text" id="wallet-field" placeholder="Kendi Cüzdan Adresiniz (عنوان محفظتك للسحب)">
    </div>
    
    <button class="btn btn-green" onclick="sendRequest('deposit')">Para Yatırma Talebi (طلب إيداع)</button>
    <button class="btn btn-red" onclick="sendRequest('withdraw')">Para Çekme Talebi (طلب سحب)</button>
    <button class="btn" style="background-color: #9b59b6;" onclick="sendRequest('invite_bonus')">Davet Bonusu Talebi (طلب مكافأة دعوة)</button>

    <!-- زر الدعم الفني المربوط بحسابك الشخصي مباشرة -->
    <a href="https://t.me" target="_blank" class="btn-support">💬 Canlı Destek (الدعم الفني)</a>
</div>

<script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : '';

    function loginUser() {
        const username = document.getElementById('username-field').value;
        if (!username) return alert('Lütfen kullanıcı adı girin!');

        fetch(`\${API_URL}/api/user/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert('Giriş Başarılı! (تم الحفظ والاتصال)');
                document.getElementById('user-balance').innerText = data.user.balance.toFixed(2) + ' USDT';
                document.getElementById('user-team').innerText = data.user.teamCount;
            }
        });
    }

    function sendRequest(type) {
        const username = document.getElementById('username-field').value;
        const amount = document.getElementById('amount-field').value;
        const wallet = document.getElementById('wallet-field').value;

        if (!username) return alert('Lütfen önce kullanıcı adınızı kilitleyin!');
        if (type !== 'invite_bonus' && !amount) return alert('Lütfen miktar girin!');

        // إذا كان نوع الطلب إيداع، نرسل تلقائياً عنوان محفظتك للمشرف ليتحقق منه
        const actualWallet = type === 'deposit' ? document.getElementById('admin-deposit-wallet').innerText : wallet;

        fetch(`\${API_URL}/api/user/request`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, amount, type, walletAddress: actualWallet })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
            }
        });
    }
</script>

</body>
</html>
