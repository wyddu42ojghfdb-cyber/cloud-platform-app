<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111c33"><title>لوحة إدارة المنظومة</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1426;--card:#111c33;--line:#263650;--muted:#a5b2c7;--blue:#2563eb;--green:#16a34a;--red:#dc2626}*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:#f8fafc;font:15px/1.6 system-ui,sans-serif}.container{max-width:1200px;margin:auto}h1{color:#7dd3fc;text-align:center}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}input,button{font:inherit;border-radius:7px;padding:9px}input{background:#080f1d;color:white;border:1px solid var(--line);max-width:220px}button{border:0;background:var(--blue);color:white;font-weight:700;cursor:pointer;margin:3px}button.green{background:var(--green)}button.red{background:var(--red)}button:disabled{opacity:.5}#login-panel{max-width:460px;margin:30px auto}#message{min-height:1.5em;color:#93c5fd}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:9px;border:1px solid var(--line);text-align:center}th{background:#1e293b;color:#cbd5e1}td input{width:95px}.muted{color:var(--muted);font-size:.9rem}.hidden{display:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  </style>
</head>
<body>
<main class="container">
  <h1>لوحة إدارة المنظومة</h1>
  <section id="login-panel" class="card">
    <h2>تسجيل دخول المشرف</h2>
    <form id="login-form"><label for="admin-password">كلمة مرور المشرف</label><br><input id="admin-password" type="password" autocomplete="current-password" required><button>دخول</button></form>
    <p id="message" role="status"></p>
  </section>
  <section id="dashboard" class="hidden">
    <div class="card bar"><strong>عدد الحسابات: <span id="total-users">0</span></strong><span>تحديث تلقائي كل 4 ثوانٍ</span><button id="logout" class="red">تسجيل الخروج</button></div>
    <div class="card"><h2>طلبات مالية معلقة</h2><p class="muted">الموافقة تسجل تغييراً في دفتر التطبيق فقط، ولا تنفذ تحويلاً بلوكتشين.</p><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>النوع</th><th>المبلغ</th><th>المحفظة / التفاصيل</th><th>الإجراء</th></tr></thead><tbody id="requests-body"></tbody></table></div></div>
    <div class="card"><h2>الحسابات</h2><div class="table-wrap"><table><thead><tr><th>اسم المستخدم</th><th>رأس المال</th><th>ربح اليوم</th><th>المكافأة</th><th>الفريق</th><th>حفظ</th></tr></thead><tbody id="users-body"></tbody></table></div></div>
  </section>
</main>
<script>
'use strict';
const loginPanel = document.getElementById('login-panel');
const dashboard = document.getElementById('dashboard');
const message = document.getElementById('message');
let timer;
async function api(url, options = {}) {
  const response = await fetch(url, { credentials: 'same-origin', ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || !data.success) throw new Error(data.error || `تعذّر الاتصال (${response.status})`);
  return data;
}
function cell(row, text) { const td = document.createElement('td'); td.textContent = text == null ? '' : String(text); row.appendChild(td); return td; }
function inputCell(row, id, value, min = '0') { const td = document.createElement('td'); const input = document.createElement('input'); input.id = id; input.type = 'number'; input.step = '0.01'; input.min = min; input.value = Number(value || 0); td.appendChild(input); row.appendChild(td); }
function emptyRow(body, columns, text) { const row = document.createElement('tr'); const td = document.createElement('td'); td.colSpan = columns; td.textContent = text; row.appendChild(td); body.appendChild(row); }
async function loadDashboard() {
  try {
    const data = await api('/api/admin/requests');
    document.getElementById('total-users').textContent = data.totalUsers;
    const requestsBody = document.getElementById('requests-body'); requestsBody.replaceChildren();
    if (!data.requests.length) emptyRow(requestsBody, 5, 'لا توجد طلبات معلقة.');
    for (const item of data.requests) {
      const row = document.createElement('tr');
      cell(row, item.username); cell(row, item.type); cell(row, `USDT ${Number(item.amount).toFixed(2)}`); cell(row, item.details || item.walletAddress || '—');
      const actions = document.createElement('td');
      for (const [label, action, cls] of [['قبول','approved','green'],['رفض','rejected','red']]) {
        const button = document.createElement('button'); button.textContent = label; button.className = cls;
        button.addEventListener('click', async () => { button.disabled = true; try { await api('/api/admin/action-request', { method: 'POST', body: JSON.stringify({ requestId: item._id, action }) }); await loadDashboard(); } catch (error) { message.textContent = error.message; button.disabled = false; } }); actions.appendChild(button);
      }
      row.appendChild(actions); requestsBody.appendChild(row);
    }
    const usersBody = document.getElementById('users-body'); usersBody.replaceChildren();
    if (!data.allUsers.length) emptyRow(usersBody, 6, 'لا توجد حسابات.');
    for (const user of data.allUsers) {
      const row = document.createElement('tr'); cell(row, user.username);
      inputCell(row, `capital-${user._id}`, user.balance); inputCell(row, `profit-${user._id}`, user.todayProfit, '-1000000000'); inputCell(row, `bonus-${user._id}`, user.bonus); inputCell(row, `team-${user._id}`, user.teamCount);
      const td = document.createElement('td'); const save = document.createElement('button'); save.textContent = 'حفظ';
      save.addEventListener('click', async () => {
        save.disabled = true;
        try {
          const value = id => document.getElementById(`${id}-${user._id}`).value;
          await api('/api/admin/update-user', { method: 'POST', body: JSON.stringify({ userId: user._id, capital: value('capital'), dailyProfit: value('profit'), bonus: value('bonus'), teamCount: value('team') }) });
          message.textContent = 'تم تحديث الحساب.'; await loadDashboard();
        } catch (error) { message.textContent = error.message; save.disabled = false; }
      }); td.appendChild(save); row.appendChild(td); usersBody.appendChild(row);
    }
    message.textContent = '';
  } catch (error) {
    if (error.message.includes('authentication') || error.message.includes('401')) { dashboard.classList.add('hidden'); loginPanel.classList.remove('hidden'); if (timer) clearInterval(timer); }
    message.textContent = error.message;
  }
}
document.getElementById('login-form').addEventListener('submit', async event => {
  event.preventDefault(); message.textContent = 'جارٍ التحقق…';
  try {
    await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: document.getElementById('admin-password').value }) });
    document.getElementById('admin-password').value = ''; loginPanel.classList.add('hidden'); dashboard.classList.remove('hidden'); await loadDashboard(); timer = setInterval(loadDashboard, 4000);
  } catch (error) { message.textContent = error.message; }
});
document.getElementById('logout').addEventListener('click', async () => {
  if (timer) clearInterval(timer);
  try { await api('/api/admin/logout', { method: 'POST', body: '{}' }); } catch (_) {}
  dashboard.classList.add('hidden'); loginPanel.classList.remove('hidden'); message.textContent = 'تم تسجيل الخروج.';
});
loadDashboard();
</script>
</body>
</html>
