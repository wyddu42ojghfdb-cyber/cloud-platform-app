<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة المشرف العربية</title>
    <style>
        body { background-color: #0B1425; color: #E2E8F0; font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #111C32; }
        th, td { padding: 12px; border: 1px solid #1E293B; text-align: center; }
        th { background: #1E293B; color: #38BDF8; }
    </style>
</head>
<body>

    <h2>💻 لوحة تحكم وإدارة المنظومة العربية الحية</h2>
    <h3>📥 طلبات الأعضاء الواردة حياً (سحب / شحن)</h3>
    
    <table>
        <thead>
            <tr><th>اسم المستخدم</th><th>نوع الإجراء</th><th>المبلغ المطلوب</th><th>المحفظة المستهدفة</th></tr>
        </thead>
        <tbody id="req-table"></tbody>
    </table>

<script>
    function loadData() {
        fetch('/api/admin/requests')
        .then(res => res.json())
        .then(data => {
            const body = document.getElementById('req-table');
            body.innerHTML = data.length === 0 ? '<tr><td colspan="4" style="color:#64748B;">لا توجد طلبات معلقة حالياً...</td></tr>' : '';
            data.forEach(r => {
                body.innerHTML += `<tr><td style="color:#FFF; font-weight:bold;">${r.username}</td><td>${r.type}</td><td style="color:#22C55E;">USDT ${r.amount}</td><td>${r.wallet}</td></tr>`;
            });
        });
    }
    setInterval(loadData, 2000);
    loadData();
</script>
</body>
</html>
